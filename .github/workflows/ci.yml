name: Firmware CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - name: Test control logic
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -Ifirmware/include tests/radio_test.cpp -o build/radio_test
          ./build/radio_test
      - name: Build OLED variants
        run: pio run -e esp32s3_oled -e esp32s3_ssd1306
